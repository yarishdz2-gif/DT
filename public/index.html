<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QyrexObf — Vercel Multi-Link</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a09;color:#ebfff5;font-family:Segoe UI,Arial,sans-serif;padding:28px 14px}.wrap{max-width:1150px;margin:auto}h1{margin:0;text-align:center;color:#00ff9d;font-size:34px}.sub{text-align:center;color:#718078;margin:8px 0 24px}.card{background:#0d1210;border:1px solid #223b31;border-radius:17px;padding:18px;margin-bottom:16px;box-shadow:0 16px 44px #0007}.grid{display:grid;grid-template-columns:1fr 170px 220px;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#91a199;font-size:12px;font-weight:700;margin:0 0 7px}input,textarea{width:100%;background:#070908;border:1px solid #294138;color:#73ffca;border-radius:10px;padding:13px;outline:none;font:13px Consolas,monospace}input:focus,textarea:focus{border-color:#00ff9d}textarea{min-height:260px;resize:vertical;line-height:1.48}.small{min-height:170px}.loader{min-height:390px}.links{display:grid;gap:9px}.link{display:grid;grid-template-columns:1fr auto;gap:8px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#00ff9d;color:#031009;font-weight:800;cursor:pointer}.alt{background:#11251d;color:#6bffc4;border:1px solid #2d5946}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{margin-top:10px;color:#687970;font-size:12px}.tag{display:inline-block;border:1px solid #285645;background:#0c1914;color:#6bffc4;border-radius:999px;padding:6px 9px;font-size:11px;margin-bottom:10px}.error{color:#ff7f91}.ok{color:#70ffc4}@media(max-width:820px){.grid,.grid2{grid-template-columns:1fr}.link{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>QYREX OBFUSCATOR</h1>
<div class="sub">Crea varios enlaces con tu código Luau convertido a tokens QYREX</div>

<div class="card">
<span class="tag">VERCEL • QYREX MULTI-LINK</span>
<div class="grid">
<div><label>ORIGEN</label><input id="origin" placeholder="Se usa tu dominio actual si lo dejas vacío"></div>
<div><label>PARTES</label><input id="parts" type="number" min="1" max="30" value="6"></div>
<div><label>CLAVE QYREX</label><input id="key" value="QYREX-7F3A-PRKQ-2049"></div>
</div>
<br>
<label>CÓDIGO LUAU</label>
<textarea id="source" placeholder='print("QYREX ONLINE")
task.wait(1)
print("FUNCIONANDO")'></textarea>
<div class="row">
<button class="btn" id="generate">GENERAR TODO</button>
<button class="btn alt" id="copyLoader">COPIAR LOADER</button>
<button class="btn alt" id="copyQyrex">COPIAR QYREX</button>
</div>
<div id="status" class="status">Esperando código...</div>
</div>

<div class="card">
<label>LINKS CREADOS</label>
<div id="links" class="links"></div>
</div>

<div class="card">
<label>CÓDIGO QYREX — lo almacenado en los links</label>
<textarea id="qyrex" class="small" readonly></textarea>
</div>

<div class="card">
<label>LOADER ROBLOX</label>
<textarea id="loader" class="loader" readonly></textarea>
</div>
</div>

<script>
const TOKENS=['PRKQ','VQ7M','X9AZ','TQPX','N8LK','H2WF','R7QD','M4VX','Z8PN','KQ3R','F6TY','B9XW','J5LM','C7VA','P2ZS','W8KD'];
const HEX='0123456789ABCDEF';

function encodeQyrex(text,key){
  const a=new TextEncoder().encode(text),k=new TextEncoder().encode(key),out=[];
  for(let i=0;i<a.length;i++){
    const v=(a[i]+k[i%k.length])&255;
    out.push(TOKENS[(v>>4)&15]+HEX[v&15]);
  }
  return 'QX4:'+out.join(' ');
}

function keyLua(key){
  return 'string.char('+Array.from(new TextEncoder().encode(key)).join(',')+')';
}

function makeLoader(links,key){
  const map=TOKENS.map((t,i)=>`[${JSON.stringify(t)}]=${i}`).join(',');
  const hex=HEX.split('').map((c,i)=>`[${JSON.stringify(c)}]=${i}`).join(',');
  const lk=keyLua(key);
  const u=links.map(x=>encodeQyrex(x,key).slice(4));
  return '-- Protect dowland by Qyrexobf\n'+
`local A={${map}};local B={${hex}};local K=${lk};local U={${u.map(x=>JSON.stringify(x)).join(',')}};local function D(S)local O={};local I=0;S=tostring(S):gsub('^QX4:%s*','');for T in S:gmatch('%S+') do local P=T:sub(1,-2);local H=A[P];local L=B[T:sub(-1)];if H~=nil and L~=nil then I=I+1;local X=string.byte(K,((I-1)%#K)+1);O[#O+1]=string.char((H*16+L-X)%256)end end;return table.concat(O)end;local C={};for _,E in ipairs(U)do local X=D(E);local OK,R=pcall(function()return game:HttpGet(X)end);if not OK then error(R)end;local V=D(R);if V=='' then error('QYREX EMPTY PART')end;C[#C+1]=V end;local F,E=loadstring(table.concat(C));if not F then error(E)end;return F()`;
}

function addLink(url,index){
  const row=document.createElement('div');row.className='link';
  const input=document.createElement('input');input.value=url;input.readOnly=true;input.className='mono';
  const button=document.createElement('button');button.className='btn alt';button.textContent='COPIAR';
  button.onclick=()=>navigator.clipboard.writeText(url).then(()=>button.textContent='COPIADO').catch(()=>{input.select();document.execCommand('copy');button.textContent='COPIADO'});
  row.append(input,button);document.getElementById('links').append(row);
}

async function generate(){
  const source=document.getElementById('source').value;
  const key=document.getElementById('key').value;
  const parts=Number(document.getElementById('parts').value)||6;
  const origin=document.getElementById('origin').value.trim();
  const status=document.getElementById('status');
  if(!source.trim()){status.textContent='Pega tu código Luau.';status.className='status error';return}
  if(!key){status.textContent='Escribe una clave.';status.className='status error';return}
  status.textContent='Subiendo y creando los links...';status.className='status';
  try{
    const r=await fetch('/api/packs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,key,parts,origin})});
    const data=await r.json();
    if(!r.ok||!data.ok) throw new Error(data.message||data.error||'Error');
    document.getElementById('links').innerHTML='';
    data.links.forEach((link,i)=>addLink(link,i));
    document.getElementById('qyrex').value=data.qyrex;
    document.getElementById('loader').value=makeLoader(data.links,key);
    status.textContent=`Listo: ${data.parts} links creados.`;status.className='status ok';
  }catch(e){status.textContent='Error: '+e.message;status.className='status error'}
}

async function copyId(id){
  const value=document.getElementById(id).value;if(!value)return;
  try{await navigator.clipboard.writeText(value)}catch{const t=document.getElementById(id);t.select();document.execCommand('copy')}
}

document.getElementById('generate').onclick=generate;
document.getElementById('copyLoader').onclick=()=>copyId('loader');
document.getElementById('copyQyrex').onclick=()=>copyId('qyrex');
</script>
</body>
</html>
