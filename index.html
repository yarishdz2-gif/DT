<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QYREX Language Encoder</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,Arial,sans-serif
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#071d19 0%,#0b0b0f 38%,#060609 100%);
    color:#e9fff7;
    padding:30px 15px
}

.wrapper{
    width:100%;
    max-width:1100px;
    margin:auto
}

h1{
    text-align:center;
    color:#00ff9d;
    font-size:32px;
    margin-bottom:8px
}

.subtitle{
    text-align:center;
    color:#718078;
    margin-bottom:25px
}

.panel{
    background:rgba(15,18,20,.92);
    border:1px solid #1e3930;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.35)
}

label{
    display:block;
    margin-bottom:8px;
    color:#93a69d;
    font-size:13px;
    font-weight:600
}

input,textarea{
    width:100%;
    border:1px solid #263a33;
    background:#0a0d0c;
    color:#00ff9d;
    border-radius:12px;
    outline:none;
    padding:14px;
    font-size:13px
}

input:focus,textarea:focus{
    border-color:#00ff9d
}

textarea{
    resize:vertical;
    min-height:240px;
    font-family:Consolas,"Courier New",monospace;
    line-height:1.5
}

#qyrexOutput{
    min-height:340px;
    color:#69ffc4;
}

#runnerOutput{
    min-height:380px;
    color:#b9ffe4;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px
}

button{
    border:0;
    border-radius:11px;
    padding:12px 18px;
    background:#00ff9d;
    color:#04110b;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.18s
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.08)
}

.secondary{
    background:#10211b;
    color:#65ffc4;
    border:1px solid #275846
}

.status{
    margin-top:12px;
    color:#63776f;
    font-size:12px
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid #275846;
    background:#0c1914;
    color:#65ffc4;
    font-size:11px;
    margin-bottom:12px
}

@media(max-width:700px){
    .row{
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>
<div class="wrapper">

    <h1>QYREX LANGUAGE</h1>
    <div class="subtitle">
        Convierte Luau en tokens QYREX no legibles
    </div>

    <div class="panel">

        <span class="badge">QYREX VM 2 • TOKEN ENCODER</span>

        <div class="row">

            <div>
                <label>URL de tu programa QYREX</label>
                <input id="programUrl"
                value="https://raw.githubusercontent.com/yarishdz2-gif/DT/refs/heads/main/qyrex_vm.txt">
            </div>

            <div>
                <label>Clave QYREX</label>
                <input id="secretKey"
                value="QYREX-7F3A-PRKQ-2049">
            </div>

        </div>

        <br>

        <label>Código Luau original</label>

        <textarea id="source" placeholder='Ejemplo:
print("Hola desde QYREX")
task.wait(1)
print("QYREX funcionando")'></textarea>

        <div class="buttons">
            <button onclick="generate()">GENERAR QYREX</button>
            <button class="secondary" onclick="copyQyrex()">COPIAR QYREX</button>
            <button class="secondary" onclick="copyRunner()">COPIAR LOADER</button>
        </div>

        <div class="status" id="status">
            Esperando código...
        </div>
    </div>


    <div class="panel">

        <span class="badge">1 • QYREX PROGRAM</span>

        <label>Contenido para qyrex_vm.txt</label>

        <textarea id="qyrexOutput"
        readonly
        placeholder="Aquí aparecerán únicamente los tokens QYREX..."></textarea>

        <div class="status">
            Este es el contenido que debes pegar en tu archivo qyrex_vm.txt.
        </div>

    </div>


    <div class="panel">

        <span class="badge">2 • ROBLOX LOADER</span>

        <label>Loader que descarga e interpreta QYREX</label>

        <textarea id="runnerOutput"
        readonly
        placeholder="Aquí aparecerá el loader completo..."></textarea>

    </div>

</div>

<script>

const TOKENS = [
    "PRKQ","VQ7M","X9AZ","TQPX","N8LK","H2WF","R7QD","M4VX",
    "Z8PN","KQ3R","F6TY","B9XW","J5LM","C7VA","P2ZS","W8KD",
    "Y4QH","D9NF","G3RP","L7TX","S5VK","A8BM","E2QJ","U6XR",
    "Q4NW","X7CP","V3HL","N9ZR","T5DG","R2YM","K8FS","M6QA",
    "Z3VX","H7PK","R4TN","B2QW","J9FC","C5LX","P8VD","W3MS",
    "Y7KA","D4QZ","G8NH","L2RP","S6TX","A9VF","E3BM","U7QJ",
    "Q2XR","X8NW","V4CP","N3HL","T9ZR","R5DG","K7YM","M2FS",
    "Z6QA","H3VX","R8PK","B4TN","J7QW","C2LX","P9VD","W5MS"
];

function xorBytes(data,keyBytes){
    const result = new Uint8Array(data.length);

    for(let i=0;i<data.length;i++){
        result[i] =
            data[i] ^
            keyBytes[i % keyBytes.length];
    }

    return result;
}

function encodeQYREX(source,key){

    const encoder = new TextEncoder();

    const sourceBytes = encoder.encode(source);

    const full = new Uint8Array(4 + sourceBytes.length);

    const len = sourceBytes.length;

    full[0] = (len >>> 24) & 255;
    full[1] = (len >>> 16) & 255;
    full[2] = (len >>> 8) & 255;
    full[3] = len & 255;

    full.set(sourceBytes,4);

    const keyBytes = encoder.encode(key);

    const encrypted = xorBytes(full,keyBytes);

    const result = [];

    for(let i=0;i<encrypted.length;i+=3){

        const b1 = encrypted[i];

        const b2 =
            i + 1 < encrypted.length
            ? encrypted[i+1]
            : 0;

        const b3 =
            i + 2 < encrypted.length
            ? encrypted[i+2]
            : 0;

        const c1 = b1 >>> 2;

        const c2 =
            ((b1 & 3) << 4) |
            (b2 >>> 4);

        const c3 =
            ((b2 & 15) << 2) |
            (b3 >>> 6);

        const c4 =
            b3 & 63;

        result.push(
            TOKENS[c1],
            TOKENS[c2],
            TOKENS[c3],
            TOKENS[c4]
        );
    }

    return "QYREX2:" + result.join(" ");
}

function luaString(str){
    return JSON.stringify(str);
}

function generateRunner(url,key){

return `local QYREX_URL = ${luaString(url)}
local QYREX_KEY = ${luaString(key)}

local QYREX_TOKENS = {
${TOKENS.map((x,i)=>`    [${luaString(x)}] = ${i}`).join(",\\n")}
}

local function QYREX_CLEAN(value)
    value = value:gsub("%s+"," ")
    value = value:gsub("^%s+","")
    value = value:gsub("%s+$","")
    return value
end

local function QYREX_READ(source)

    source = QYREX_CLEAN(source)

    source = source:gsub("^QYREX2:%s*","")

    local values = {}

    for token in source:gmatch("%S+") do
        local n = QYREX_TOKENS[token]

        if n ~= nil then
            values[#values + 1] = n
        end
    end

    local encrypted = {}

    for i = 1,#values,4 do

        local a = values[i]
        local b = values[i + 1]
        local c = values[i + 2]
        local d = values[i + 3]

        if a == nil then
            break
        end

        b = b or 0
        c = c or 0
        d = d or 0

        local b1 =
            a * 4 +
            math.floor(b / 16)

        local b2 =
            (b % 16) * 16 +
            math.floor(c / 4)

        local b3 =
            (c % 4) * 64 +
            d

        encrypted[#encrypted + 1] = string.char(b1)
        encrypted[#encrypted + 1] = string.char(b2)
        encrypted[#encrypted + 1] = string.char(b3)
    end

    local keyBytes = {}

    for i = 1,#QYREX_KEY do
        keyBytes[i] = string.byte(QYREX_KEY,i)
    end

    local decoded = {}

    for i = 1,#encrypted do

        local value = string.byte(encrypted[i])

        local key =
            keyBytes[((i - 1) % #keyBytes) + 1]

        decoded[#decoded + 1] =
            string.char(value ~ key)
    end

    local raw = table.concat(decoded)

    if #raw < 4 then
        return nil,"QYREX DATA INVALID"
    end

    local length =
        string.byte(raw,1) * 16777216 +
        string.byte(raw,2) * 65536 +
        string.byte(raw,3) * 256 +
        string.byte(raw,4)

    local program =
        raw:sub(5,4 + length)

    return program,nil
end

local function QYREX_RUN(source)

    local code,errorMessage =
        QYREX_READ(source)

    if not code then
        error(errorMessage)
    end

    local compiler,compileError =
        loadstring(code)

    if not compiler then
        error(compileError)
    end

    return compiler()
end

local ok,data =
    pcall(function()
        return game:HttpGet(QYREX_URL)
    end)

if not ok then
    warn("[QYREX] No se pudo descargar el programa")
    warn(tostring(data))
    return
end

local runOk,runError =
    pcall(function()
        QYREX_RUN(data)
    end)

if not runOk then
    warn("[QYREX] Error de ejecucion")
    warn(tostring(runError))
end
`;
}

function generate(){

    const source =
        document.getElementById("source").value;

    const key =
        document.getElementById("secretKey").value;

    const url =
        document.getElementById("programUrl").value;

    const status =
        document.getElementById("status");

    if(!source.trim()){
        status.textContent =
            "Escribe código Luau primero.";
        return;
    }

    if(key.length < 4){
        status.textContent =
            "La clave debe tener mínimo 4 caracteres.";
        return;
    }

    const qyrex =
        encodeQYREX(source,key);

    const runner =
        generateRunner(url,key);

    document.getElementById("qyrexOutput").value =
        qyrex;

    document.getElementById("runnerOutput").value =
        runner;

    status.textContent =
        "QYREX generado correctamente.";
}

async function copyText(text){

    try{
        await navigator.clipboard.writeText(text);
        return true;
    }catch{

        const area =
            document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        return true;
    }
}

async function copyQyrex(){

    const value =
        document.getElementById("qyrexOutput").value;

    if(!value){
        alert("Primero genera QYREX.");
        return;
    }

    await copyText(value);

    alert("QYREX copiado.");
}

async function copyRunner(){

    const value =
        document.getElementById("runnerOutput").value;

    if(!value){
        alert("Primero genera QYREX.");
        return;
    }

    await copyText(value);

    alert("Loader copiado.");
}

</script>

</body>
</html>
