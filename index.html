<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyrexObf</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Arial,sans-serif}
body{min-height:100vh;background:#080b0a;color:#eafff6;padding:25px 15px}
.wrap{max-width:1100px;margin:auto}
h1{text-align:center;color:#00ff9d;margin-bottom:7px}
.sub{text-align:center;color:#718078;margin-bottom:25px}
.box{background:#0d1210;border:1px solid #1e3c31;border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;color:#8ea097;font-size:12px;margin-bottom:7px}
textarea,input{width:100%;background:#070908;color:#72ffc7;border:1px solid #294137;border-radius:10px;padding:13px;outline:none;font-family:Consolas,monospace;font-size:13px}
textarea{min-height:230px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{border-color:#00ff9d}
button{margin-top:12px;background:#00ff9d;color:#021008;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
button.alt{background:#10251d;color:#6bffc6;border:1px solid #2d5946;margin-left:7px}
.status{font-size:12px;color:#63766e;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="wrap">
<h1>QYREX OBFUSCATOR</h1>
<div class="sub">Luau → QYREX TOKENS → Roblox</div>

<div class="box">
<div class="row">
<div>
<label>LINK</label>
<input id="url" value="https://raw.githubusercontent.com/yarishdz2-gif/DT/refs/heads/main/qyrex_vm.txt">
</div>
<div>
<label>KEY</label>
<input id="key" value="QYREX-7F3A-PRKQ-2049">
</div>
</div>

<br>

<label>CÓDIGO LUAU</label>
<textarea id="source" placeholder='print("Hola")
task.wait(1)
print("QYREX ONLINE")'></textarea>

<button onclick="generate()">GENERAR</button>
<button class="alt" onclick="copy("urlout")">COPIAR LINK</button>
<button class="alt" onclick="copy("codeout")">COPIAR QYREX</button>
<button class="alt" onclick="copy("loader")">COPIAR LOADER</button>

<div id="status" class="status">Esperando...</div>
</div>

<div class="box">
<label>LINK OFUSCADO</label>
<textarea id="urlout" readonly></textarea>
</div>

<div class="box">
<label>CÓDIGO OFUSCADO → qyrex_vm.txt</label>
<textarea id="codeout" readonly></textarea>
</div>

<div class="box">
<label>LOADER ROBLOX — UNA SOLA LÍNEA</label>
<textarea id="loader" readonly></textarea>
</div>
</div>

<script>
const TOKENS=[
"K9M","RX7","P4D","ZT8",
"NL2","FQ9","HB6","W3V",
"CM5","YJ4","DS8","LQ1",
"UA7","VE3","GS9","KP6"
];

const HEX="0123456789ABCDEF";

function encode(text,key){
    const a=new TextEncoder().encode(text);
    const k=new TextEncoder().encode(key);
    const out=[];

    for(let i=0;i<a.length;i++){
        const v=(a[i]+k[i%k.length])&255;
        const hi=(v>>4)&15;
        const lo=v&15;
        out.push(TOKENS[hi]+"-"+HEX[lo]);
    }

    return "KX3:"+out.join(" ");
}

function luaKey(key){
    return "string.char("+Array.from(new TextEncoder().encode(key)).join(",")+")";
}

function makeLoader(url,key){
    const eurl=encode(url,key);
    const klua=luaKey(key);

    const tokenTable="{"+
        TOKENS.map((x,i)=>`["${x}"]=${i}`).join(",")+
    "}";

    const hexTable="{"+
        HEX.split("").map((x,i)=>`["${x}"]=${i}`).join(",")+
    "}";

    const line=
`local a=${tokenTable};local b=${hexTable};local k=${klua};local function d(s)local o={};local n=0;s=tostring(s):gsub("^KX3:%s*","");for t in s:gmatch("%S+") do local x,y=t:match("^([A-Z0-9]+)%-([0-9A-F])$");if x and y then local h=a[x];local l=b[y];if h~=nil and l~=nil then n=n+1;local kb=string.byte(k,((n-1)%#k)+1);o[#o+1]=string.char((h*16+l-kb)%256)end end end;return table.concat(o)end;local u=d("${eurl.slice(4)}");local ok,r=pcall(function()return game:HttpGet(u)end);if not ok then return end;local c=d(r);if type(c)~="string" or c=="" then return end;local f=loadstring(c);if type(f)~="function" then return end;pcall(f)`;

    return "-- Protect dowland by Qyrexobf\n"+line;
}

function generate(){
    const source=document.getElementById("source").value;
    const url=document.getElementById("url").value.trim();
    const key=document.getElementById("key").value;

    if(!source.trim()){
        document.getElementById("status").textContent="Pega código primero.";
        return;
    }

    if(!url||!key){
        document.getElementById("status").textContent="Falta link o key.";
        return;
    }

    const eurl=encode(url,key);
    const ecode=encode(source,key);
    const loader=makeLoader(url,key);

    document.getElementById("urlout").value=eurl;
    document.getElementById("codeout").value=ecode;
    document.getElementById("loader").value=loader;

    document.getElementById("status").textContent=
        "Generado correctamente.";
}

async function copy(id){
    const v=document.getElementById(id).value;
    if(!v){
        alert("Genera primero.");
        return;
    }

    try{
        await navigator.clipboard.writeText(v);
    }catch{
        const t=document.createElement("textarea");
        t.value=v;
        document.body.appendChild(t);
        t.select();
        document.execCommand("copy");
        t.remove();
    }

    alert("Copiado.");
}
</script>

</body>
</html>
