<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QyrexObf</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,Arial,sans-serif
}

body{
    min-height:100vh;
    background:#080b0a;
    color:#eafff6;
    padding:25px 15px
}

.wrap{
    width:100%;
    max-width:1100px;
    margin:auto
}

h1{
    text-align:center;
    color:#00ff9d;
    font-size:32px;
    margin-bottom:6px
}

.sub{
    text-align:center;
    color:#6d7d75;
    margin-bottom:24px;
    font-size:14px
}

.box{
    background:#0d1210;
    border:1px solid #203b31;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px
}

label{
    display:block;
    color:#8ea097;
    font-size:12px;
    font-weight:600;
    margin-bottom:7px
}

input,textarea{
    width:100%;
    background:#070908;
    border:1px solid #293e35;
    border-radius:10px;
    color:#72ffc7;
    outline:none;
    padding:13px;
    font-family:Consolas,"Courier New",monospace;
    font-size:13px
}

input:focus,textarea:focus{
    border-color:#00ff9d
}

textarea{
    resize:vertical;
    min-height:230px;
    line-height:1.5
}

.large{
    min-height:330px
}

.loader{
    min-height:400px
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}

button{
    margin-top:12px;
    border:0;
    border-radius:10px;
    padding:12px 18px;
    background:#00ff9d;
    color:#031009;
    font-weight:700;
    cursor:pointer
}

button.alt{
    background:#10221b;
    border:1px solid #285845;
    color:#69ffc3;
    margin-left:7px
}

.status{
    color:#63776e;
    font-size:12px;
    margin-top:10px
}

@media(max-width:700px){
    .row{
        grid-template-columns:1fr
    }

    button.alt{
        margin-left:0
    }
}
</style>
</head>

<body>

<div class="wrap">

<h1>QYREX OBFUSCATOR</h1>
<div class="sub">Luau → QYREX → Roblox</div>

<div class="box">

<div class="row">

<div>
<label>LINK DE QYREX</label>
<input
id="url"
value="https://raw.githubusercontent.com/yarishdz2-gif/DT/refs/heads/main/qyrex_vm.txt">
</div>

<div>
<label>CLAVE</label>
<input
id="key"
value="QYREX-7F3A-PRKQ-2049">
</div>

</div>

<br>

<label>PEGA AQUÍ TU CÓDIGO LUAU</label>

<textarea
id="source"
placeholder='Ejemplo:

print("Hola QYREX")
task.wait(1)
print("Sistema funcionando")'></textarea>

<button onclick="generate()">GENERAR QYREX</button>
<button class="alt" onclick="copyBox('urlOut')">COPIAR LINK</button>
<button class="alt" onclick="copyBox('codeOut')">COPIAR CÓDIGO</button>
<button class="alt" onclick="copyBox('loaderOut')">COPIAR LOADER</button>

<div id="status" class="status">
Esperando código...
</div>

</div>


<div class="box">

<label>LINK OFUSCADO</label>

<textarea
id="urlOut"
readonly></textarea>

</div>


<div class="box">

<label>CÓDIGO OFUSCADO — ESTO VA EN qyrex_vm.txt</label>

<textarea
id="codeOut"
class="large"
readonly></textarea>

</div>


<div class="box">

<label>LOADER — UNA SOLA LÍNEA DESPUÉS DEL COMENTARIO</label>

<textarea
id="loaderOut"
class="loader"
readonly></textarea>

</div>

</div>


<script>

const TOKENS = [
    "PRKQ",
    "VQ7M",
    "X9AZ",
    "TQPX",
    "N8LK",
    "H2WF",
    "R7QD",
    "M4VX",
    "Z8PN",
    "KQ3R",
    "F6TY",
    "B9XW",
    "J5LM",
    "C7VA",
    "P2ZS",
    "W8KD"
];

const HEX = "0123456789ABCDEF";


function encodeQyrex(text,key){

    const data =
        new TextEncoder().encode(text);

    const keyBytes =
        new TextEncoder().encode(key);

    const result = [];

    for(let i=0;i<data.length;i++){

        const mixed =
            (data[i] + keyBytes[i % keyBytes.length]) & 255;

        const high =
            (mixed >> 4) & 15;

        const low =
            mixed & 15;

        result.push(
            TOKENS[high] + HEX[low]
        );
    }

    return "QX9:" + result.join(" ");
}


function keyToLua(key){

    const bytes =
        new TextEncoder().encode(key);

    return "string.char(" +
        Array.from(bytes).join(",") +
        ")";
}


function createLoader(url,key){

    const encodedURL =
        encodeQyrex(url,key);

    const luaKey =
        keyToLua(key);

    const tokenMap =
        TOKENS.map(
            (token,index)=>
                `["${token}"]=${index}`
        ).join(",");

    const hexMap =
        HEX.split("")
        .map(
            (char,index)=>
                `["${char}"]=${index}`
        )
        .join(",");

    const code =
`local __qxA={${tokenMap}};local __qxB={${hexMap}};local __qxK=${luaKey};local function __qxD(__qxS)local __qxO={};local __qxI=0;__qxS=tostring(__qxS):gsub("^%s+",""):gsub("%s+$","");__qxS=__qxS:gsub("^QX9:%s*","");for __qxT in __qxS:gmatch("%S+") do local __qxP=__qxT:sub(1,-2);local __qxH=__qxA[__qxP];local __qxL=__qxB[__qxT:sub(-1)];if __qxH~=nil and __qxL~=nil then __qxI=__qxI+1;local __qxKB=string.byte(__qxK,((__qxI-1)%#__qxK)+1);local __qxV=(__qxH*16+__qxL)-__qxKB;if __qxV<0 then __qxV=__qxV+256 end;__qxO[#__qxO+1]=string.char(__qxV)end end;return table.concat(__qxO)end;local __qxU=__qxD("${encodedURL.slice(4)}");local __qxHttp=game:GetService("HttpService");local __qxOK,__qxR=pcall(function()return __qxHttp:GetAsync(__qxU,false)end);if not __qxOK then error("QYREX HTTP ERROR")end;local __qxCode=__qxD(__qxR);if __qxCode=="" then error("QYREX EMPTY PROGRAM")end;local __qxFn,__qxErr=loadstring(__qxCode);if not __qxFn then error(__qxErr)end;return __qxFn()`;

    return "-- Protect dowland by Qyrexobf\n" + code;
}


function generate(){

    const source =
        document.getElementById("source").value;

    const url =
        document.getElementById("url").value.trim();

    const key =
        document.getElementById("key").value;

    const status =
        document.getElementById("status");


    if(!source.trim()){

        status.textContent =
            "Pega código Luau primero.";

        return;
    }


    if(!url){

        status.textContent =
            "Falta el enlace.";

        return;
    }


    if(!key){

        status.textContent =
            "Falta la clave.";

        return;
    }


    const encodedURL =
        encodeQyrex(url,key);

    const encodedCode =
        encodeQyrex(source,key);

    const loader =
        createLoader(url,key);


    document.getElementById("urlOut").value =
        encodedURL;

    document.getElementById("codeOut").value =
        encodedCode;

    document.getElementById("loaderOut").value =
        loader;


    status.textContent =
        "Código convertido completamente a QYREX.";
}


async function copyBox(id){

    const box =
        document.getElementById(id);

    if(!box.value){

        alert("Genera primero.");

        return;
    }

    try{

        await navigator.clipboard.writeText(
            box.value
        );

    }catch{

        box.focus();
        box.select();

        document.execCommand("copy");
    }

    alert("Copiado.");
}

</script>

</body>
</html>
