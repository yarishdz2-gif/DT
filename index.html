<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Panel de Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220;
  --card: #121a2b;
  --border: #1e2a3f;
  --text: #e8edf5;
  --muted: #8b9bb4;
  --gold: #c9a84c;
  --accent: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-wrap {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.4);
}
.login-logo {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, #1a2740, #0b1220);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; font-weight: 700; color: var(--gold);
  margin: 0 auto 24px;
}
.login-card h1 {
  text-align: center;
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 6px;
}
.login-card p {
  text-align: center;
  color: var(--muted);
  font-size: 0.875rem;
  margin-bottom: 28px;
}
.fg { margin-bottom: 18px; }
.fg label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.fg input {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  transition: border-color 0.2s;
}
.fg input:focus {
  outline: none;
  border-color: var(--gold);
}
.btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: #0b1220;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 8px;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.error {
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
}
.error.show { display: block; }
.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: var(--muted);
  font-size: 0.85rem;
  text-decoration: none;
}
.back:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">A</div>
    <h1>Panel de Administración</h1>
    <p>Acceso exclusivo para administradores</p>
    <div class="error" id="error">Contraseña incorrecta. Intenta de nuevo.</div>
    <form onsubmit="login(event)">
      <div class="fg">
        <label>Contraseña de administrador</label>
        <input type="password" id="pass" placeholder="Ingresa la contraseña" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Entrar al panel</button>
    </form>
    <a href="../index.html" class="back">← Volver al sitio web</a>
  </div>
</div>
<script>
const ADMIN_PASS = 'ST/&gauidnslkjj("#)/"!jmssldnajsdbaskdbsDA';

// Si ya está logueado, redirigir
if (sessionStorage.getItem('admin_auth') === 'ok') {
  window.location.href = 'dashboard.html';
}

function login(e) {
  e.preventDefault();
  const pass = document.getElementById('pass').value;
  if (pass === ADMIN_PASS) {
    sessionStorage.setItem('admin_auth', 'ok');
    sessionStorage.setItem('admin_login_time', new Date().toISOString());
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('error').classList.add('show');
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
  }
}
</script>
</body>
</html>
