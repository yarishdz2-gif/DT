<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QyrexObf — Multi Link</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0c;color:#eafef5;font-family:Segoe UI,Arial,sans-serif;padding:28px 14px}.wrap{max-width:1120px;margin:auto}h1{margin:0;text-align:center;color:#00ff9d;font-size:32px}.sub{text-align:center;color:#708078;margin:8px 0 24px}.card{background:#0d1110;border:1px solid #223a31;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 16px 44px #0007}label{display:block;color:#91a199;font-size:12px;font-weight:700;margin:0 0 7px}.grid{display:grid;grid-template-columns:1fr 150px 180px;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{width:100%;background:#070908;border:1px solid #294138;color:#73ffca;border-radius:10px;padding:13px;outline:none;font:13px Consolas,monospace}input:focus,textarea:focus{border-color:#00ff9d}textarea{min-height:270px;resize:vertical;line-height:1.48}.small{min-height:120px}.links{display:grid;gap:8px}.link{display:flex;gap:8px}.link input{flex:1}.btn{border:0;border-radius:10px;padding:11px 15px;background:#00ff9d;color:#031009;font-weight:800;cursor:pointer}.alt{background:#11251d;color:#6bffc4;border:1px solid #2d5946}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{margin-top:10px;color:#687970;font-size:12px}.mono{font-family:Consolas,monospace}.loader{min-height:360px}.tag{display:inline-block;border:1px solid #285645;background:#0c1914;color:#6bffc4;border-radius:999px;padding:6px 9px;font-size:11px;margin-bottom:10px}@media(max-width:820px){.grid,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>QYREX OBFUSCATOR</h1>
<div class="sub">Crea varios links con tu código QYREX ofuscado</div>

<div class="card">
<span class="tag">QYREX MULTI-LINK</span>
<div class="grid">
<div><label>URL BASE DEL SERVIDOR</label><input id="origin" placeholder="https://tu-dominio.onrender.com"></div>
<div><label>PARTES</label><input id="parts" type="number" min="1" max="30" value="6"></div>
<div><label>CLAVE</label><input id="key" value="QYREX-7F3A-PRKQ-2049"></div>
</div>
<br>
<label>CÓDIGO LUAU</label>
<textarea id="source" placeholder='print("QYREX ONLINE")
task.wait(1)
print("FUNCIONANDO")'></textarea>
<div class="row">
<button class="btn" id="generate">GENERAR PACK QYREX</button>
<button class="btn alt" id="copyLoader">COPIAR LOADER</button>
</div>
<div id="status" class="status">Esperando código...</div>
</div>

<div class="card">
<label>LINKS CREADOS</label>
<div id="links" class="links"></div>
</div>

<div class="card">
<label>CÓDIGO QYREX REMOTO</label>
<textarea id="packInfo" class="small" readonly></textarea>
</div>

<div class="card">
<label>LOADER ROBLOX</label>
<textarea id="loader" class="loader" readonly></textarea>
</div>
</div>

<script>
const TOKENS=['PRKQ','VQ7M','X9AZ','TQPX','N8LK','H2WF','R7QD','M4VX','Z8PN','KQ3R','F6TY','B9XW','J5LM','C7VA','P2ZS','W8KD'];
const HEX='0123456789ABCDEF';

function encode(text,key){
  const a=new TextEncoder().encode(text), k=new TextEncoder().encode(key), out=[];
  for(let i=0;i<a.length;i++){
    const v=(a[i]+k[i%k.length])&255;
    out.push(TOKENS[(v>>4)&15]+HEX[v&15]);
  }
  return 'QX4:'+out.join(' ');
}

function luaStringBytes(text){
  const bytes=new TextEncoder().encode(text);
  return 'string.char('+Array.from(bytes).join(',')+')';
}

function makeLoader(links,key){
  const map=TOKENS.map((t,i)=>`["${t}"]=${i}`).join(',');
  const hex=HEX.split('').map((c,i)=>`["${c}"]=${i}`).join(',');
  const luaKey=luaStringBytes(key);
  const encodedLinks=links.map(x=>encode(x,key).slice(4));
  const urls='{' + encodedLinks.map(x=>`'${x}'`).join(',') + '}';

  const line=`local A={${map}};local B={${hex}};local K=${luaKey};local U=${urls};local function D(S)local O={};local I=0;S=tostring(S):gsub('^QX4:%s*','');for T in S:gmatch('%S+') do local P=T:sub(1,-2);local H=A[P];local L=B[T:sub(-1)];if H~=nil and L~=nil then I=I+1;local X=string.byte(K,((I-1)%#K)+1);O[#O+1]=string.char((H*16+L-X)%256)end end;return table.concat(O)end;local C={};for _,E in ipairs(U) do local X=D(E);local OK,R=pcall(function()return game:HttpGet(X)end);if not OK then error('QYREX HTTP ERROR')end;local V=D(R);if V=='' then error('QYREX EMPTY PART')end;C[#C+1]=V end;local F,E=loadstring(table.concat(C));if not F then error(E)end;return F()`;
  return '-- Protect dowland by Qyrexobf\n'+line;
}

async function generate(){
  const source=document.getElementById('source').value;
  const key=document.getElementById('key').value;
  const parts=Math.max(1,Math.min(30,Number(document.getElementById('parts').value)||6));
  const origin=document.getElementById('origin').value.trim().replace(/\/$/,'');
  const status=document.getElementById('status');

  if(!source.trim())return status.textContent='Pega código Luau primero.';
  if(!key)return status.textContent='Pon una clave.';
  if(!origin)return status.textContent='Pon la URL de tu servidor.';

  status.textContent='Generando links...';

  try{
    const r=await fetch('/api/packs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,key,parts})});
    const data=await r.json();
    if(!r.ok||!data.ok)throw new Error(data.error||'Error creando pack');

    const links=data.links.map(x=>x.startsWith('http')?x:origin+x);
    document.getElementById('links').innerHTML=links.map((x,i)=>`<div class="link"><input value="${escapeHtml(x)}" readonly><button class="btn alt" data-copy="${escapeHtml(x)}">COPIAR</button></div>`).join('');
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy));

    document.getElementById('packInfo').value=links.map((x,i)=>`PARTE ${i+1}: ${x}`).join('\n');
    document.getElementById('loader').value=makeLoader(links,key);
    status.textContent=`Listo: ${links.length} links creados.`;
  }catch(e){
    status.textContent='ERROR: '+e.message;
  }
}

function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}

async function copyText(text){
  try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
}

document.getElementById('generate').onclick=generate;
document.getElementById('copyLoader').onclick=()=>copyText(document.getElementById('loader').value);
</script>
</body>
</html>
